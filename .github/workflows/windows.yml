name: Build Windows

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Community Rebuild Dependencies
        shell: bash
        run: |
          missing=0
          for marker in \
            external/adaptive_layouts/pubspec.yaml \
            external/identity/pubspec.yaml \
            external/lastfm/pubspec.yaml \
            external/media_library/pubspec.yaml \
            external/smtc-win32/bindings/system_media_transport_controls/pubspec.yaml \
            external/tag_reader/pubspec.yaml \
            external/taglib/taglib/pubspec.yaml \
            external/taglib/taglib_libs/pubspec.yaml \
            assets/localizations/index.json \
            lib/private/crossfade_player.dart; do
            if [ ! -f "$marker" ]; then
              echo "missing: $marker"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::The community-rebuilt replacement dependencies are missing."
            echo "::error::This repository vendors its dependencies under external/ — see REBUILD.md."
            exit 1
          fi

      - name: Enable Long Paths
        run: git config --system core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.3"
          cache: true

      - name: Patch Flutter
        run: |
          $flutterRoot = Split-Path -Parent (Split-Path -Parent (Get-Command flutter).Source)
          $file = Join-Path $flutterRoot "packages/flutter/lib/src/widgets/widget_state.dart"
          $content = Get-Content $file -Raw
          $content = $content.Replace("return kIsWeb ? SystemMouseCursors.click : SystemMouseCursors.basic;", "return SystemMouseCursors.click;")
          Set-Content -Path $file -Value $content -NoNewline

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build
        run: |
          flutter build windows --release `
            --dart-define=API_KEY=${{ secrets.API_KEY || '' }} `
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || '' }} `
            --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY || '' }} `
            --dart-define=LASTFM_SHARED_SECRET=${{ secrets.LASTFM_SHARED_SECRET || '' }} `
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || '' }} `
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY || '' }} `
            --dart-define=REVENUECAT_API_KEY=''

      - name: Bundle Executable
        run: |
          cp -r build/windows/x64/runner/Release harmonoid-windows-x64-exe
          tar.exe -a -c -f harmonoid-windows-x64-exe.zip harmonoid-windows-x64-exe

      - name: Bundle Installer
        run: |
          "%programfiles(x86)%\Inno Setup 6\iscc.exe" "Harmonoid_InnoSetup_x64.iss"
        shell: cmd

      - name: Upload Artifact (Portable ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: harmonoid-windows-x64-exe
          path: harmonoid-windows-x64-exe.zip

      - name: Upload Artifact (Installer)
        uses: actions/upload-artifact@v4
        with:
          name: harmonoid-windows-x64-setup
          path: Output/harmonoid-windows-x64-setup.exe

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          files: |
            harmonoid-windows-x64-exe.zip
            Output/harmonoid-windows-x64-setup.exe
