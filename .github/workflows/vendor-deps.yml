name: Vendor Dependencies

# The harmonoid external/* "submodule" repositories are PRIVATE upstream
# repositories (they went private when the project adopted the PolyForm
# Strict license, around 2022-2023). A plain checkout of this repository
# therefore cannot resolve its path dependencies and cannot be built.
#
# This workflow initializes the submodules using a GitHub token provided
# through the ACCESS_TOKEN repository secret (the token must have read
# access to the private harmonoid/* repositories), then "un-submodules"
# them: the sources are committed directly into this repository so that
# future checkouts - including the Windows build workflow - work without
# any token at all.
#
# If you have been granted access to the upstream private repositories
# (for example by the upstream maintainer), set the ACCESS_TOKEN secret
# and run this workflow once.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    name: Vendor submodule dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize submodules
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::The ACCESS_TOKEN secret is not set."
            echo "The external/* dependencies of this repository point to PRIVATE upstream"
            echo "repositories owned by the harmonoid organization. They are not publicly"
            echo "cloneable, not archived anywhere (Software Heritage, Wayback Machine,"
            echo "pub.dev, Debian) and cannot be recovered from public sources."
            echo ""
            echo "To vendor them you need a GitHub token with READ access to:"
            echo "  harmonoid/adaptive_layouts  harmonoid/identity      harmonoid/lastfm"
            echo "  harmonoid/media_library     harmonoid/smtc-win32    harmonoid/tag_reader"
            echo "  harmonoid/taglib            harmonoid/private       harmonoid/localizations"
            echo ""
            echo "Ask the upstream maintainer for collaborator access, then add the token"
            echo "as a repository secret named ACCESS_TOKEN and re-run this workflow."
            exit 1
          fi
          git config --global url."https://x-access-token:${ACCESS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Verify submodule contents
        run: |
          set -e
          missing=0
          for marker in \
            external/adaptive_layouts/pubspec.yaml \
            external/identity/pubspec.yaml \
            external/lastfm/pubspec.yaml \
            external/media_library/pubspec.yaml \
            external/smtc-win32/smtc-win32.sln \
            external/tag_reader/pubspec.yaml \
            external/taglib/taglib/pubspec.yaml \
            external/taglib/taglib_libs/pubspec.yaml \
            assets/localizations/index.json; do
            if [ ! -f "$marker" ]; then
              echo "::error::expected file '$marker' is missing after submodule init"
              missing=1
            fi
          done
          if [ -z "$(ls -A lib/private 2>/dev/null)" ]; then
            echo "::error::lib/private is empty after submodule init"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All submodule contents are present."

      - name: Commit vendored sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached external/smtc-win32 assets/localizations external/tag_reader external/adaptive_layouts external/media_library external/lastfm external/identity external/taglib lib/private
          git rm .gitmodules
          git add -A
          git status --short | head -60
          git commit -m "chore: vendor external dependencies"
          git push origin HEAD:master
