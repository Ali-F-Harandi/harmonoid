name: taglib_libs
description: >-
  Bundles the native taglib library for Harmonoid.
  Community reimplementation placeholder — no native library is bundled yet.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
