name: identity
description: >-
  Account & subscription management for Harmonoid.
  Offline community reimplementation (original private upstream package is
  unavailable): no backend, all "Plus" features unlocked locally.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.4.8
  freezed: ^3.2.3
  json_serializable: ^6.9.0
